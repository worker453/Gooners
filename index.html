<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gooners TV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background:#0f0f0f; color:white; font-family:sans-serif; margin:0; padding:20px; }
  h1 { text-align:center; color:#ff0055; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; margin-top:20px; }
  .video { background:#1a1a1a; padding:10px; border-radius:10px; }
  video { width:100%; border-radius:8px; }
  #status { text-align:center; margin-top:50px; color:#aaa; }
</style>
</head>
<body>
  <h1>Gooners TV</h1>
  <div id="status">Loading videos...</div>
  <div class="grid" id="videoList"></div>

<script>
    const SUPABASE_URL = 'https://mlrsaizdrdlijgtzuoltv.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1scnNhaXpkcmRsamd0enVvbHR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzYwOTcsImV4cCI6MjEwNDU1MjA5N30.NzNbG_ADfLLABSKnZaEFdfNvN8NWnVJrx1vXkA7qHDM'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function loadVideos() {
      const { data: files, error } = await supabase.storage.from('Videos').list('', { limit: 100 })
      
      if (error) { 
        document.getElementById('status').innerText = 'Error: ' + error.message 
        return 
      }
      
      if(!files || files.length === 0) { 
        document.getElementById('status').innerText = 'No videos uploaded yet' 
        return 
      }
      
      document.getElementById('status').style.display = 'none'
      const container = document.getElementById('videoList')
      
      const videoFiles = files.filter(f => f.name.match(/\.(mp4|webm|mov)$/i))
      
      let html = '';
      videoFiles.forEach(file => {
        const { data } = supabase.storage.from('Videos').getPublicUrl(file.name)
        html += `
          <div class="video">
            <video controls preload="metadata" src="${data.publicUrl}"></video>
            <h3>${file.name}</h3>
          </div>
        `
      })
      container.innerHTML = html;
    }
    loadVideos()
</script>
</body>
</html>
